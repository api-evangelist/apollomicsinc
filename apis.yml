name: Apollomics, Inc.
description: >-
  Apollomics, Inc. (Nasdaq: APLM) is a clinical-stage biopharmaceutical company
  headquartered in Foster City, California, focused on the discovery and
  development of oncology therapies designed to be combined with other treatments
  to harness the immune system and target specific molecular pathways that inhibit
  cancer. Operating since 2016, Apollomics has a pipeline of nine drug candidates
  spanning small-molecule targeted drugs and biologics, including late-stage
  programs such as vebreltinib (Phase 2, NSCLC and solid tumors with cMet
  dysregulation) and uproleselan (Phase 3 in China for relapsed/refractory AML).
  The company became publicly traded via a business combination with Maxpro
  Capital Acquisition Corp. Surfaced as a portfolio company of Qiming and added to
  the API Evangelist network; as a biopharmaceutical company it publishes no
  public developer API surface — this profile carries its corporate identity and
  domain-security posture.
